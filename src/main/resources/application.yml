spring:
  application:
    name: servicedesk
  datasource:
    url: ${SERVICEDESK_DB_URL:jdbc:postgresql://localhost:5432/servicedesk}
    username: ${SERVICEDESK_DB_USERNAME:servicedesk}
    password: ${SERVICEDESK_DB_PASSWORD:servicedesk}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

servicedesk:
  jwt:
    secret: ${SERVICEDESK_JWT_SECRET:local-development-secret-least-32-bytes-long-0123456789}
    issuer: servicedesk
    access-token-ttl: ${SERVICEDESK_JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${SERVICEDESK_JWT_REFRESH_TTL:P7D}
  bootstrap:
    admin-email: ${SERVICEDESK_ADMIN_EMAIL:admin@servicedesk.local}
    admin-password: ${SERVICEDESK_ADMIN_PASSWORD:ChangeMe!123}
    admin-first-name: System
    admin-last-name: Administrator
  cors:
    allowed-origins: ${SERVICEDESK_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  booking:
    zone: Europe/Warsaw
    min-lead-time: PT1H
    max-advance-booking: P60D
    late-cancellation-window: PT24H
    slot-granularity: PT15M
  pricing:
    max-total-discount-percentage: 25.00
    loyalty-spend-window-months: 12
  billing:
    invoice-tax-rate: 0.230
    invoice-payment-term-days: 14

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
